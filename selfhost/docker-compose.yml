# CoDesignFlo on your own box: Supabase's open-source stack (Postgres, Auth, PostgREST, Realtime, Storage) and the
# CoDesignFlo server, behind one entry (Caddy) on one port.
#
#   cp .env.example .env && node scripts/generate-keys.mjs     # secrets and keys, written into .env
#   docker compose up -d                                       # then open PUBLIC_URL
#
# Supabase's services follow Supabase's official self-hosting compose file (supabase/supabase, docker/), with the
# image versions of its 2026-11-05 update; Studio, the analytics stack, edge functions, the pooler and imgproxy are
# left out (CoDesignFlo doesn't use them). Nothing but the entry is published on the host.

name: codesignflo

services:
  # ── The single public entry ──────────────────────────────────────────────────────────────────────────────
  gateway:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    depends_on:
      codesignflo:
        condition: service_started
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
      realtime:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:8080"
      # With SITE_ADDRESS set to a domain, Caddy serves HTTPS itself: publish 80 and 443 instead (see .env.example).
      # - "80:80"
      # - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # ── CoDesignFlo ──────────────────────────────────────────────────────────────────────────────────────────
  codesignflo:
    image: ${CODESIGNFLO_IMAGE:-codesignflo-server:local}
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CODESIGNFLO_MODE: selfhost
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL}
      # This server reaches Supabase through the entry, inside Docker; everyone else at PUBLIC_URL.
      SUPABASE_URL: http://gateway:8080
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NOTIFY_SECRET: ${NOTIFY_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CoDesignFlo}
      EMAIL_AUTOCONFIRM: ${EMAIL_AUTOCONFIRM:-true}
      PLUGIN_INSTALL_URL: ${PLUGIN_INSTALL_URL:-}
      FIGMA_COMMUNITY_URL: ${FIGMA_COMMUNITY_URL:-}
      NOTIFY_EVERY_MINUTES: ${NOTIFY_EVERY_MINUTES:-10}

  # One-shot, at every start: applies new database migrations and the box's settings, then exits.
  migrate:
    image: ${CODESIGNFLO_IMAGE:-codesignflo-server:local}
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    command: ["/app/migrate.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      # The database pings the server here when there's a notification to send (pg_net, inside Docker).
      NOTIFY_URL: http://codesignflo:3000/api/notify
      NOTIFY_SECRET: ${NOTIFY_SECRET}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      SETUP_CODE: ${SETUP_CODE:-}
      # Whether Auth proves email addresses (SMTP and EMAIL_AUTOCONFIRM=false): then invitations need no code.
      SMTP_HOST: ${SMTP_HOST:-}
      EMAIL_AUTOCONFIRM: ${EMAIL_AUTOCONFIRM:-true}

  # ── Supabase ─────────────────────────────────────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      # The first start creates the database and restarts Postgres once: give it a few minutes.
      retries: 30
      start_period: 120s
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}/**
      # Sign-up stays on: the database decides who may (the first account, people invited, ALLOWED_DOMAINS).
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${PUBLIC_URL}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # Without SMTP nobody can get a confirmation email: accounts are confirmed at sign-up (see .env.example).
      GOTRUE_MAILER_AUTOCONFIRM: ${EMAIL_AUTOCONFIRM:-true}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_FROM_NAME:-CoDesignFlo}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  realtime:
    image: supabase/realtime:v2.148.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        # Realtime takes its tenant from the host name it's asked as: the entry asks for this one.
        aliases:
          - realtime-dev.supabase-realtime
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    image: supabase/storage-api:v1.89.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage

volumes:
  db-data:
  db-config:
  storage-data:
  caddy-data:
