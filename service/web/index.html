    <style>
      :root { color-scheme: light dark; --bg: #fff; --panel: #f7f7f8; --fg: #1e1e1e; --muted: #6b6b6b; --line: #e6e6e6; --brand: #0d99ff; --warn: #e5484d; --ok: #1a7f37; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --panel: #262626; --fg: #f2f2f2; --muted: #a0a0a0; --line: #383838; --ok: #4ac26b; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.5 Inter, system-ui, sans-serif; }
      a { color: var(--brand); text-decoration: none; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      h2 { margin: 0 0 8px; font-size: 15px; }
      p { margin: 0 0 8px; }
      code, pre { font: 12px/1.4 ui-monospace, monospace; }
      pre { white-space: pre-wrap; background: var(--panel); padding: 8px; border-radius: 6px; max-height: 300px; overflow: auto; }
      .muted { color: var(--muted); }
      .err { color: var(--warn); }
      .ok { color: var(--ok); }
      .narrow { width: min(380px, calc(100% - 32px)); margin: 12vh auto 0; display: flex; flex-direction: column; gap: 14px; }
      .narrow p { margin: 0; color: var(--muted); }
      .code { font: 600 24px/1.2 ui-monospace, monospace; letter-spacing: 3px; padding: 10px 0; }
      .narrow input.code-input { height: 52px; font: 600 22px/1 ui-monospace, monospace; letter-spacing: 3px; text-align: center; text-transform: uppercase; }
      .facts { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
      .facts > div { display: flex; flex-direction: column; gap: 2px; }
      .facts .muted { font-size: 12px; }
      .narrow p.notice { margin: 0; color: var(--fg); }
      button, input, select { font: inherit; height: 36px; border-radius: 8px; border: 1px solid var(--line); padding: 0 12px; background: var(--bg); color: var(--fg); min-width: 0; }
      .narrow button, .narrow input { height: 40px; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--brand); color: #fff; border-color: transparent; font-weight: 600; }
      button.danger { color: var(--warn); border-color: var(--warn); }
      button.small { height: 28px; padding: 0 10px; font-size: 13px; }

      .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .brand { font-weight: 700; color: var(--fg); display: inline-flex; align-items: center; gap: 8px; }
      .grow { flex: 1; }
      .page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

      .consent-box label.check { display: flex; gap: 10px; align-items: flex-start; line-height: 1.5; color: var(--fg); }
      .consent-box label.check input { height: auto; margin-top: 4px; flex: none; }
      .count { color: var(--muted); font-weight: 400; }
      .list { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }

      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      .invite-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-top: 2px; }

      .agents { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      .agent { height: 30px; font-size: 13px; }
      .agent.on { border-color: var(--brand); color: var(--brand); font-weight: 600; }
      .connect ol { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
      a.button { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); }
      a.button.primary { background: var(--brand); color: #fff; border-color: transparent; font-weight: 600; }
      @media (max-width: 600px) { .table th:nth-child(2), .table td:nth-child(2) { display: none; } }
      /* Landing page (OrkestralAI's look: heavy uppercase titles, one phrase on blue, square black buttons). */
      .lp { --ink: #050505; --paper: #f4f4f4; --blue: #2d6cdf; --mutedl: #71717a; --linel: #d4d4d8; --dark: #090909; --product: #131929;
        background: var(--paper); color: var(--ink); color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .lp a { color: inherit; }
      .lp-container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
      .lp-top { display: flex; align-items: center; gap: 20px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--ink); position: sticky; top: 0; z-index: 5; }
      .lp-brand .logo, .brand .logo { transform: translateY(-9%); }
      .lp-brand { font: 900 18px/1 "Space Grotesk", Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 10px; }
      .lp-nav { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
      .lp-top .lp-button, .lp-nav { white-space: nowrap; }
      .lp-nav:hover { color: var(--blue); }
      .lp-button { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 26px; border-radius: 0; border: 1px solid var(--ink);
        background: var(--ink); color: #fff !important; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; transition: background 160ms, border-color 160ms, color 160ms; }
      .lp-button:hover { background: var(--blue); border-color: var(--blue); }
      .lp-button.lp-outline { background: transparent; color: var(--ink) !important; }
      .lp-button.lp-outline:hover { background: var(--ink); color: #fff !important; border-color: var(--ink); }
      .lp-button.lp-small { height: 34px; padding: 0 14px; font-size: 12px; }
      .lp-section { padding: clamp(64px, 8vw, 112px) 0; }
      .lp-white { background: #fff; }
      .lp-paper { background: var(--paper); }
      .lp-dark { background: var(--dark); color: #fff; }
      .lp-hero { padding: 56px 0 72px; text-align: center; border-bottom: 1px solid var(--ink); }
      .lp-eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 14px; }
      .lp-boxed { display: inline-block; border: 1px solid var(--ink); padding: 4px 12px; }
      .lp-blue-text { color: var(--blue); }
      .lp-title, .lp-title-sm { font-family: "Space Grotesk", Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 0; margin: 0; }
      .lp-title { font-size: clamp(2rem, 5.2vw, 4.25rem); line-height: 0.95; margin: 0 auto; }
      .lp-line { display: inline-block; white-space: nowrap; }
      @media (max-width: 700px) { .lp-line { white-space: normal; } }
      .lp-title-sm { font-size: clamp(1.7rem, 3.4vw, 2.85rem); line-height: 1; }
      .lp-hl-text { display: inline-block; background: var(--blue); color: #fff; padding: 0 0.16em 0.05em; }
      .lp-lead { font-size: 19px; font-weight: 600; line-height: 1.55; max-width: 760px; margin: 22px auto 28px; }
      .lp-section .lp-lead { margin-left: 0; color: #3f3f46; font-weight: 500; }
      .lp-lead.lp-on-dark { color: rgba(255,255,255,0.7); }
      .lp-cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .lp-section .lp-cta { justify-content: flex-start; margin-top: 28px; }
      .lp-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 22px 0 44px; font-size: 12px; font-weight: 800; text-transform: uppercase; }
      .lp-chip { border: 1px solid var(--ink); padding: 4px 12px; }
      .lp-muted { color: var(--mutedl); }
      .lp-card { border: 1px solid var(--ink); background: #fff; padding: 24px; display: flex; flex-direction: column; }
      .lp-card .lp-note { margin-top: auto; }
      .lp-card h3 { font-size: 22px; font-weight: 900; margin: 0 0 10px; line-height: 1.15; }
      .lp-card p { color: #52525b; line-height: 1.7; margin: 0; font-size: 14.5px; }
      .lp-card ol { padding-left: 20px; display: flex; flex-direction: column; gap: 12px; margin: 6px 0 16px; font-size: 14.5px; line-height: 1.6; }
      .lp-card ul { padding-left: 20px; display: flex; flex-direction: column; gap: 10px; margin: 6px 0 16px; font-size: 14.5px; line-height: 1.6; }
      .lp-card pre { margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--product); color: #e2e8f0; border-radius: 0; padding: 10px 12px; font-size: 12px; }
      .lp-card a:not(.lp-button) { color: var(--blue); font-weight: 700; }
      .lp-card .lp-button { margin-top: 8px; }
      .lp-note { border-left: 4px solid var(--blue); background: #eff6ff; padding: 12px 14px; color: #27272a !important; font-weight: 600; }
      .lp-grid { display: grid; gap: 20px; margin-top: 36px; }
      .lp-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lp-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      /* Section headings: eyebrow, title and intro as one centred block. */
      .lp-head { text-align: center; max-width: 760px; margin: 0 auto; }
      .lp-head .lp-lead { margin: 18px auto 0 !important; }
      .lp-head + .lp-grid, .lp-head + .lp-loop, .lp-head + .lp-faq { margin-top: 44px; }
      /* Cards that answer to the pointer. */
      .lp-lift { transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease; }
      .lp-lift:hover { transform: translateY(-3px); border-color: var(--blue); box-shadow: 6px 6px 0 var(--ink); }
      .lp-card > .lp-eyebrow { margin-bottom: 10px; }
      /* F.A.Q.: questions and answers, two columns, ruled. */
      .lp-faq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; max-width: 980px; margin-left: auto; margin-right: auto; }
      .lp-qa { border-top: 1px solid var(--ink); padding: 20px 0 28px; }
      .lp-qa h3 { font-size: 18px; font-weight: 900; margin: 0 0 8px; }
      .lp-qa p { color: #52525b; line-height: 1.7; margin: 0; font-size: 15px; }
      /* Setup steps: numbered squares. */
      .lp-card ol { list-style: none; padding-left: 0; counter-reset: step; }
      .lp-card ol > li { counter-increment: step; position: relative; padding-left: 38px; }
      .lp-card ol > li::before { content: counter(step); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; display: grid; place-items: center;
        background: var(--ink); color: #fff; font: 800 12px/1 "Space Grotesk", Inter, sans-serif; }
      .lp-loop { list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid rgba(255,255,255,0.25); }
      .lp-step { position: relative; padding: 28px 24px; border-right: 1px solid rgba(255,255,255,0.25); }
      .lp-step:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 26px; width: 24px; height: 24px; display: grid; place-items: center;
        background: var(--blue); color: #fff; font-weight: 800; font-size: 13px; z-index: 1; }
      .lp-step:last-child { border-right: 0; }
      .lp-step h3 { font: 700 22px/1 "Space Grotesk", Inter, sans-serif; text-transform: uppercase; margin: 14px 0 10px; }
      .lp-step p { color: rgba(255,255,255,0.68); line-height: 1.65; margin: 0; font-size: 14.5px; }
      .lp-n { font: 900 14px/1 "Space Grotesk", Inter, sans-serif; color: var(--blue); letter-spacing: 0.08em; }
      /* The main call to action: blue, larger. */
      .lp-button.lp-primary { background: var(--blue); border-color: var(--blue); }
      .lp-button.lp-primary:hover { background: var(--ink); border-color: var(--ink); }
      .lp-button.lp-big { height: 58px; padding: 0 34px; font-size: 16px; }
      .lp-free { margin: 16px 0 0; font-size: 14px; font-weight: 700; color: #3f3f46; }
      .lp-free span { color: var(--blue); margin: 0 6px; }
      /* Calls to action tilt a little on hover. */
      .lp-section .lp-button, .lp-hero .lp-button { transition: transform 0.18s ease, background 0.18s, border-color 0.18s, color 0.18s; }
      .lp-section .lp-button:hover, .lp-hero .lp-button:hover { transform: rotate(-2deg) scale(1.03); }
      @media (prefers-reduced-motion: reduce) { .lp-section .lp-button:hover, .lp-hero .lp-button:hover { transform: none; } }
      /* Get started: each card's sign-in sits right under its title. */
      .lp-card-cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 22px; padding-bottom: 22px; border-bottom: 1px solid var(--linel); }
      .lp-card .lp-card-cta .lp-button { margin-top: 0; }
      .lp-card-cta .lp-muted { font-size: 13px; font-weight: 700; color: var(--mutedl); }
      /* The cards' last block sits at the bottom, so buttons side by side are level. */
      .lp-card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
      .lp-card-foot .lp-note { margin-top: 0; }
      .lp-card .lp-card-foot .lp-button { margin-top: 0; }
      /* The plugin download in a step: on its own line, with the how-to below it. */
      .lp-card .lp-dl { display: block; margin: 12px 0 8px; }
      .lp-card .lp-dl .lp-button { margin-top: 0; }
      .lp-card .lp-dl-how { display: block; font-size: 13px; color: var(--mutedl); line-height: 1.5; }
      /* The FAQ's last slot: ask the support assistant. */
      .lp-ask { align-self: start; margin-top: 20px; background: var(--ink); color: #fff; padding: 26px; display: flex; flex-direction: column; align-items: flex-start; }
      .lp-ask h3 { font-size: 20px; font-weight: 900; margin: 0 0 8px; }
      .lp-ask .lp-button.lp-primary:hover { background: #fff; border-color: #fff; color: var(--ink) !important; }
      .lp-ask p { color: rgba(255,255,255,0.75); line-height: 1.6; margin: 0 0 18px; font-size: 15px; }
      /* The demo video, where the hero's product picture goes. */

        background: var(--product); box-shadow: 0 33px 110px rgba(0,0,0,0.35); }
      .lp-product video { display: block; width: 100%; height: auto; aspect-ratio: 1920 / 1140; background: var(--product); }

      .lp-table table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13.5px; }
      .lp-table th, .lp-table td { border: 1px solid var(--linel); padding: 8px 10px; text-align: left; vertical-align: top; color: #27272a; line-height: 1.5; }
      .lp-table th { background: #fafafa; font-weight: 800; }
      .consent { position: fixed; z-index: 1000; left: 16px; right: 16px; bottom: 16px; max-width: 720px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
        background: #050505; color: #fff; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); font: 13.5px/1.5 Inter, system-ui, sans-serif; }

      .consent a { color: #93c5fd; }
      .consent-actions { display: flex; gap: 8px; }

      .consent button { font: 700 13px Inter, system-ui, sans-serif; padding: 9px 14px; border-radius: 8px; cursor: pointer; border: 1px solid #fff; background: #fff; color: #050505; }

      .lp-refer-terms { color: #fff !important; font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
      .lp-refer-terms:hover { color: var(--ink) !important; }
      @media (max-width: 600px) { .lp-refer { padding: 30px 18px 20px; box-shadow: 6px 6px 0 #fff; } }
      /* The ticker: the Day to day titles scrolling on a black band. */
      .lp-marquee { overflow: hidden; background: var(--ink); color: #fff; border-top: 4px solid var(--ink); padding: 16px 0; }
      .lp-marquee-track { display: flex; width: max-content; animation: lp-marquee 42s linear infinite; }
      .lp-marquee:hover .lp-marquee-track { animation-play-state: paused; }
      .lp-marquee span { padding: 0 26px; white-space: nowrap; font: 900 clamp(16px, 2.2vw, 24px)/1 "Space Grotesk", Inter, sans-serif; text-transform: uppercase; letter-spacing: 0.02em; }
      .lp-marquee b { color: var(--blue); font-size: 20px; line-height: 1; }
      @keyframes lp-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .lp-marquee + .lp-section { border-top: 0; }
      /* The demo video: a hard-shadowed frame. */
      .lp-product { border: 3px solid var(--ink); border-radius: 0; box-shadow: 14px 14px 0 var(--blue); }
      @media (max-width: 600px) {
        .lp-card { box-shadow: 5px 5px 0 var(--ink); }
        .lp-product { box-shadow: 8px 8px 0 var(--blue); }
      }
      @media (prefers-reduced-motion: reduce) {
        .lp-marquee-track { animation: none; }
        .lp-section .lp-button:hover, .lp-hero .lp-button:hover, .lp-lift:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <script>
      // The page is written out at build time (the landing page, or a legal page): someone signed in, or opening
      // another page of the app (#/docs, #/p/…, a sign-in code), doesn't see it flash before the app draws theirs.
      try {
        var h = location.hash, q = location.search;
        var signedIn = Object.keys(localStorage).some(function (k) { return k.indexOf("sb-") === 0 && /-auth-token$/.test(k); });
        var legal = /^\/(privacy|terms|impressum|cookies|security)(\.html|\/)?$/.test(location.pathname);
        if (!legal && ((h.indexOf("#/") === 0 && h !== "#/") || /[?&](code|mcp)=/.test(q) || signedIn))
          document.documentElement.classList.add("app-only");
      } catch (e) {}
    </script>
    <style>html.app-only #app > .lp[data-prerendered] { visibility: hidden; }</style>
    <main id="app"><p class="narrow">Loading…</p></main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
